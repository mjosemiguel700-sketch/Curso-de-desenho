<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1d1917">
  <meta name="description" content="Curso prático de desenho mangá e produção do primeiro capítulo.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Atelier Mangá</title>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header>
    <a class="brand" href="#hoje" aria-label="Atelier Mangá, início"><span>AT</span><b>Atelier<br>Mangá</b></a>
    <div class="top-actions">
      <button id="install" type="button" hidden>Instalar app</button>
      <button class="ghost" id="backup" type="button">Backup</button>
      <button class="ghost" id="import" type="button">Importar</button>
    </div>
  </header>
  <nav aria-label="Navegação principal">
    <button data-page="hoje" class="active" type="button">Hoje</button>
    <button data-page="trilha" type="button">Trilha</button>
    <button data-page="progresso" type="button">Progresso</button>
    <button data-page="portfolio" type="button">Portfólio</button>
    <button data-page="capitulo" type="button">Capítulo</button>
  </nav>
  <main id="conteudo" tabindex="-1">
    <section id="hoje" class="page active"></section>
    <section id="trilha" class="page"></section>
    <section id="progresso" class="page"></section>
    <section id="portfolio" class="page"></section>
    <section id="capitulo" class="page"></section>
  </main>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
